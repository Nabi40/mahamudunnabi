<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Arcade - Play SNES Games</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #14121F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      color: #FFF;
      overflow: hidden;
      background-image: radial-gradient(circle at 2px 2px, rgba(255, 255, 255, 0.05) 1.5px, transparent 0);
      background-size: 22px 22px;
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 900px;
      max-height: 600px;
      border: 4px solid #14121F;
      box-shadow: 10px 10px 0 #CBFF4D;
      background: #000;
      position: relative;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    .back-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #FF3E8A;
      color: #14121F;
      border: 3px solid #14121F;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 4px 4px 0 #14121F;
      z-index: 9999;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.1s ease;
      text-transform: uppercase;
    }
    .back-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #14121F;
    }
    #local-warning {
      display: none;
      position: absolute;
      top: 80px;
      left: 15px;
      right: 15px;
      background: #FF3E8A;
      border: 3px solid #14121F;
      padding: 15px;
      font-weight: bold;
      color: #14121F;
      box-shadow: 4px 4px 0 #CBFF4D;
      font-size: 14px;
      z-index: 9998;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Exit Arcade</a>

  <div id="local-warning">
    ⚠️ LOCAL ENVIRONMENT WARNING:<br>
    WebAssembly emulators cannot run locally from a 'file://' address due to browser security settings. 
    To test this locally, run a local web server (e.g., start VS Code 'Live Server' or run 'npx http-server' in your terminal).
  </div>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    if (window.location.protocol === 'file:') {
      document.getElementById('local-warning').style.display = 'block';
    }

    EJS_player = "#game";
    EJS_core = "snes";
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    EJS_gameUrl = "rom.zip";
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
